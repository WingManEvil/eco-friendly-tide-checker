<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#04202e">
<title>Diani Tide — High &amp; Low</title>
<style>
  :root{
    --deep:#04202e; --deep2:#062c3d; --card:#0a3a4d; --line:rgba(255,255,255,.10);
    --ink:#f2f7f9; --dim:#8fb3c2; --sand:#f0c98a; --sea:#4fd1c5;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:radial-gradient(120% 70% at 50% 0%, #0b4a61 0%, var(--deep2) 45%, var(--deep) 100%);
    color:var(--ink); min-height:100vh;
    font:400 16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    padding:22px 16px 40px; display:flex; justify-content:center;
  }
  .wrap{width:100%; max-width:460px}
  header{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:20px}
  .place{font-size:13px; letter-spacing:.16em; text-transform:uppercase; color:var(--sand); font-weight:600}
  .today{font-size:12px; color:var(--dim)}

  .hero{
    background:linear-gradient(170deg, var(--card), rgba(10,58,77,.35));
    border:1px solid var(--line); border-radius:22px; padding:22px 20px 20px; margin-bottom:14px;
  }
  .eyebrow{font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:var(--dim); font-weight:700}
  .big{font-size:54px; line-height:1; font-weight:300; letter-spacing:-.02em; margin:8px 0 2px; font-variant-numeric:tabular-nums}
  .big small{font-size:15px; letter-spacing:.06em; color:var(--dim); margin-left:5px; font-weight:400}
  .height{font-size:15px; color:var(--dim); margin-top:2px}
  .kind{display:inline-flex; align-items:center; gap:6px; font-size:13px; color:var(--sand); font-weight:600; margin-top:10px}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--sand)}
  .count{font-size:13px; color:var(--dim); margin-top:8px}

  .bar{position:relative; height:6px; border-radius:99px; background:rgba(255,255,255,.09); margin:20px 0 8px; overflow:hidden}
  .fill{position:absolute; inset:0 auto 0 0; background:linear-gradient(90deg,var(--sea),var(--sand)); border-radius:99px; transition:width .6s ease}
  .barlbl{display:flex; justify-content:space-between; font-size:11px; color:var(--dim); letter-spacing:.04em}

  .sect{font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:var(--dim); font-weight:700; margin:26px 0 10px}
  .rows{border:1px solid var(--line); border-radius:16px; overflow:hidden; background:rgba(10,58,77,.30)}
  .row{display:flex; align-items:center; gap:12px; padding:14px 16px; border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:0}
  .row.now{background:rgba(240,201,138,.10)}
  .row.past{opacity:.42}
  .tag{font-size:10px; letter-spacing:.12em; font-weight:800; padding:3px 7px; border-radius:6px; min-width:48px; text-align:center}
  .tag.h{background:rgba(240,201,138,.16); color:var(--sand)}
  .tag.l{background:rgba(79,209,197,.14); color:var(--sea)}
  .time{font-size:19px; font-variant-numeric:tabular-nums}
  .mtr{margin-left:auto; font-size:13px; color:var(--dim); font-variant-numeric:tabular-nums}

  details{border:1px solid var(--line); border-radius:16px; background:rgba(10,58,77,.30); overflow:hidden}
  summary{padding:14px 16px; cursor:pointer; font-size:14px; list-style:none}
  summary::-webkit-details-marker{display:none}
  summary::after{content:"+"; float:right; color:var(--dim)}
  details[open] summary::after{content:"–"}
  .day{padding:12px 16px; border-top:1px solid var(--line)}
  .dayname{font-size:12px; color:var(--sand); letter-spacing:.08em; text-transform:uppercase; margin-bottom:6px}
  .daytimes{display:flex; flex-wrap:wrap; gap:6px 14px; font-size:14px; font-variant-numeric:tabular-nums}
  .daytimes b{font-weight:700; color:var(--dim); font-size:11px; letter-spacing:.06em; margin-right:3px}

  footer{margin-top:26px; font-size:12px; line-height:1.7; color:#a8c6d4}
  footer b{color:var(--sand); font-weight:600}
  .err{background:rgba(242,161,161,.12); border:1px solid rgba(242,161,161,.3); color:#ffd9d9;
       padding:16px; border-radius:14px; font-size:14px; line-height:1.6}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="place">Diani Beach</div>
    <div class="today" id="todayLabel">&nbsp;</div>
  </header>

  <div id="app"><div class="hero"><div class="eyebrow">Loading…</div></div></div>

  <footer>
    <b>Official prediction</b> — Kenya Marine &amp; Fisheries Research Institute, Mombasa station (2026), generated from real gauge observations.<br>
    Heights in metres above lowest astronomical tide · local time GMT+3.<br>
    Diani usually runs a few minutes behind the harbour.
  </footer>
</div>

<script src="tides.js"></script>
<script>
const TZ = "Africa/Nairobi";
const dayFmt  = new Intl.DateTimeFormat("en-GB", { timeZone: TZ, weekday: "short", day: "numeric", month: "short" });
const timeFmt = new Intl.DateTimeFormat("en-GB", { timeZone: TZ, hour: "numeric", minute: "2-digit", hour12: true });
const keyFmt  = new Intl.DateTimeFormat("en-CA", { timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit" });

const dayKey = d => keyFmt.format(d);
const clock  = d => timeFmt.format(d).replace(" ", "").toLowerCase();      // "6:21am"

// The booklet stores wall-clock Diani time. Pin the real offset so it is correct
// even if this page is opened on a phone set to another timezone.
const stamp = (day, hhmm) => new Date(day + "T" + hhmm + ":00+03:00");

function eventsFor(day) {
  const row = TIDES[day];
  if (!row) return [];
  return [
    ...row.high.map(e => ({ type: "HIGH", height: e.h, date: stamp(day, e.t) })),
    ...row.low .map(e => ({ type: "LOW",  height: e.h, date: stamp(day, e.t) })),
  ].sort((a, b) => a.date - b.date);
}

function addDays(day, n) {
  const d = new Date(day + "T12:00:00+03:00");
  d.setDate(d.getDate() + n);
  return dayKey(d);
}

// "12:34am" on its own is confusing when the clock has already passed midnight.
const qualifier = (d, today) => {
  const k = dayKey(d);
  if (k === today) return "";
  if (k === addDays(today, 1)) return "tomorrow";
  return dayFmt.format(d);
};

function render() {
  const now = new Date();
  const today = dayKey(now);

  // gather a fortnight of events so "next" always exists, even late at night
  const ev = [];
  for (let i = -1; i <= 8; i++) ev.push(...eventsFor(addDays(today, i)));
  ev.sort((a, b) => a.date - b.date);

  const next = ev.find(e => e.date > now);
  const idx = next ? ev.indexOf(next) : -1;
  const prev = idx > 0 ? ev[idx - 1] : null;
  const after = idx >= 0 ? ev[idx + 1] : null;

  document.getElementById("todayLabel").textContent = dayFmt.format(now);

  if (!next) {
    document.getElementById("app").innerHTML = `<div class="err">
      <b>No tide data for today.</b><br>
      The 2026 KMFRI table covers 1 Jan – 31 Dec 2026. The next year's booklet is published
      each December.</div>`;
    return;
  }

  const mins = Math.round((next.date - now) / 60000);
  const count = mins >= 60 ? `in ${Math.floor(mins / 60)}h ${mins % 60}m` : `in ${mins}m`;
  const pct = prev ? Math.min(100, Math.max(0, (now - prev.date) / (next.date - prev.date) * 100)) : 50;

  const row = e => {
    const isNext = e === next;
    return `<div class="row ${isNext ? "now" : e.date < now ? "past" : ""}">
      <span class="tag ${e.type === "HIGH" ? "h" : "l"}">${e.type}</span>
      <span class="time">${clock(e.date)}</span>
      <span class="mtr">${e.height.toFixed(2)} m</span></div>`;
  };

  const todayRows = eventsFor(today).map(row).join("");
  const weekRows = [1, 2, 3, 4, 5, 6, 7].map(n => {
    const k = addDays(today, n), list = eventsFor(k);
    if (!list.length) return "";
    return `<div class="day">
      <div class="dayname">${dayFmt.format(list[0].date)}</div>
      <div class="daytimes">${list.map(e =>
        `<span><b>${e.type === "HIGH" ? "H" : "L"}</b>${clock(e.date)} <span style="opacity:.55">${e.height.toFixed(1)}m</span></span>`
      ).join("")}</div></div>`;
  }).join("");

  const parts = timeFmt.formatToParts(next.date);
  const g = t => (parts.find(x => x.type === t) || { value: "" }).value;
  const nq = qualifier(next.date, today);
  const aq = after ? qualifier(after.date, today) : "";

  document.getElementById("app").innerHTML = `
    <div class="hero">
      <div class="eyebrow">Next ${next.type.toLowerCase()} tide${nq ? " · " + nq : ""}</div>
      <div class="big">${g("hour")}:${g("minute")}<small>${g("dayPeriod").toLowerCase()}</small></div>
      <div class="height">${next.height.toFixed(2)} m</div>
      <div class="kind"><span class="dot"></span>${next.type === "HIGH" ? "Water coming in" : "Water going out"}</div>
      <div class="count">${count}${after ? ` · then ${after.type.toLowerCase()} at ${clock(after.date)}${aq ? " " + aq : ""} (${after.height.toFixed(2)} m)` : ""}</div>
      <div class="bar"><div class="fill" style="width:${pct.toFixed(0)}%"></div></div>
      <div class="barlbl">
        <span>${prev ? prev.type + " " + clock(prev.date) : ""}</span>
        <span>${next.type} ${clock(next.date)}</span>
      </div>
    </div>

    <div class="sect">Today</div>
    <div class="rows">${todayRows || '<div class="row"><span class="mtr">nothing left today</span></div>'}</div>

    <div class="sect">Week ahead</div>
    <details><summary>Show the next 7 days</summary>${weekRows}</details>
  `;
}

render();
setInterval(render, 60000);   // tick the countdown every minute
</script>
</body>
</html>
